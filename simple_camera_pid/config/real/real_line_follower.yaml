# Real-hardware parameters. Covers three deployment shapes that all share the
# same vision/camera/PID tuning:
#   - line_follower_node: single-node, vision+PID in one process
#     (see launch/real/real_line_follower.launch.py). Run this on whichever
#     machine has the camera topic reachable -- it's network-agnostic.
#   - line_follower_vision_node + line_follower_control_node: the split
#     architecture (vision_node on the Pi next to the camera,
#     control_node on the PC) -- see simple_camera_pid/real/vision_node.py's
#     module docstring for why you'd want this split.
# The /**: section below applies to ANY node name, so both shapes read the
# same camera/vision tuning from one place -- edit it once, not per-node.

/**:
  ros__parameters:
    # --- Real camera geometry -- image_width/image_height/camera_pitch_deg
    # are CONFIRMED: image_width/image_height was 800x600 (measured from
    # ~/camera_test_frame.png on the Pi) until 2026-08-03, when the real
    # camera's driver was reconfigured to 640x480 to match MuJoCo/Gazebo (see
    # common/camera_geometry.py's turtlebot3_burger_gazebo_camera()
    # docstring) -- re-verify against a fresh capture if this drifts again.
    # camera_pitch_deg confirmed 2026-08-03 directly against the real robot
    # -- the camera IS mounted at 15 deg down-pitch (matching
    # hpc/*/lsac/vision.py's CAM_PITCH_DEG, which turned out to already be
    # correct -- it was this yaml's placeholder 0.0 that was wrong, not that
    # file). camera_fovy_deg/camera_mount_height are still UNCONFIRMED as
    # real measurements -- they're copied from turtlebot3_burger_gazebo_camera(),
    # so these may already be the real numbers rather than sim placeholders,
    # but there's no separate calibration record on the Pi to confirm that --
    # verify before trusting (checkerboard calibration or datasheet + a tape
    # measure). See turtlebot3_burger_real_camera()'s docstring in
    # simple_camera_pid/common/camera_geometry.py for how to get each value.
    #
    # IMPORTANT: every real-robot vision test run earlier in this session
    # (the heading-rotation and lateral-shift sign-convention checks) used
    # the WRONG pitch_deg=0.0 AND the since-superseded 800x600 resolution --
    # their found/sign conclusions still hold (those only depended on which
    # side the line was on, not exact geometry), but the numeric
    # lateral_error/heading_error magnitudes from those runs don't apply
    # anymore and shouldn't be reused as reference values.
    camera_profile: real
    image_width: 640     # CONFIRMED 2026-08-03: real camera driver reconfigured to this
    image_height: 480    # CONFIRMED 2026-08-03: real camera driver reconfigured to this
    # 2026-08-04: 45.9857 (an Intel RealSense r200 leftover, copied from the
    # old Gazebo preset) -> 48.6867, derived from the official Raspberry Pi
    # Camera Module v2 (IMX219) spec the real robot actually uses: 62.2 deg
    # horizontal, so 2*atan((480/640)*tan(62.2deg/2)) = 48.6867 at this 4:3
    # output (official quotes 48.8 vertical; 0.11 deg is spec rounding).
    # Spec-derived, so still not a per-unit MEASUREMENT -- calibrate to be sure.
    camera_fovy_deg: 48.6867     # UNCONFIRMED as a real measurement -- see note above
    camera_mount_height: 0.133   # UNCONFIRMED as a real measurement -- see note above
    camera_pitch_deg: 15.0       # CONFIRMED 2026-08-03 against the real robot
    camera_roll_deg: 0.0         # UNCONFIRMED (added 2026-08-07, no-op default) --
    # mount roll about the optical axis. A 2026-08-07 session found a stable,
    # low-noise heading_error/lateral_error bias with the robot stationary
    # and centered on a straight line (heading_error ~+0.21 to +0.34 rad,
    # lateral_error ~+0.01 to +0.02, drifted between separate sessions --
    # suspected mount looseness, not measurement noise) that this and/or
    # camera_yaw_deg below are meant to cancel. See
    # turtlebot3_burger_real_camera()'s docstring (common/camera_geometry.py)
    # for the calibration procedure -- do not guess a value here, measure it
    # via /line_follower/local_path with the robot stationary.
    camera_yaw_deg: 0.0          # UNCONFIRMED (added 2026-08-07, no-op default) --
    # mount yaw about true-vertical; see camera_roll_deg's comment above and
    # turtlebot3_burger_real_camera()'s docstring for calibration.

    # Vision thresholds -- min_brightness/max_saturation are the most likely
    # to need retuning for real ambient lighting (indoor fluorescent/LED vs.
    # Gazebo's rendered lighting model). roi_bottom_fraction/lookahead_distance
    # started as the Gazebo values; re-measure found-rate on your real track
    # before trusting them (see common/vision.py's roi_widen_step docstring
    # for how this project debugged the same problem in sim).
    #
    # 2026-08-04: min_brightness 70 -> 170, max_saturation 0.30 -> 0.20.
    # Root-caused a live oscillation crash (control_node commanded violent
    # wheel-speed swings, robot span in place) to _detect_mask's real-frame
    # segmentation, not the PID gains -- see lap_20260804_162821 bag
    # analysis. Extracted the exact frames around the crash and reran
    # LineFollowerVision offline: the false-positive frame had 50.5% of the
    # ROI's ground pixels sitting in the value=[70,90) bin (vs. 24.7% in a
    # clean frame moments before) -- ordinary asphalt brightness had drifted
    # up to sit ON TOP OF the old min_brightness=70 threshold, so roughly
    # half the ground got flagged as line-candidate and the sliding window
    # snapped between the real line and that false region, flipping
    # steering_error from +0.42 to -0.12 in under 100ms. Value=[110,190) was
    # essentially EMPTY in both frames (line pixels sit at 200+, ground never
    # got above ~90) -- 170 sits in that gap with margin on both sides, so it
    # should hold even as ground brightness drifts with real lighting.
    # max_saturation tightened alongside it since ground saturation (p90
    # ~0.10-0.11 in both sampled frames) turned out to contribute little
    # separation from line pixels (~0.01-0.02) at 0.30 -- 0.20 gives it some
    # actual filtering power without touching the line's own ~0.02. Both
    # derived from only two real frames (one clean, one mid-crash) -- re-tune
    # against a fuller real-track sample if false positives recur.
    #
    # 2026-08-07 MERGE NOTE -- READ BEFORE THE NEXT REAL RUN. The 170/0.20
    # above and the kp: 0.7 below have NEVER RUN TOGETHER on the robot. The
    # Pi was working from a branch point that predated the 170/0.20 change,
    # so every kp run in that tuning log (2.0 -> 1.0 -> 1.5 -> 0.7) was
    # driven with min_brightness=70 / max_saturation=0.30 -- i.e. with
    # exactly the segmentation that this comment block documents as
    # flagging ~half the ground as line-candidate. That means the
    # "oscillation" those runs measured (0.70-0.78 steering-sign-flips/sec)
    # may be partly or wholly the sliding window snapping between the real
    # line and a false region, NOT underdamped control -- which would make
    # kp: 0.7 a compensation for a bug that no longer exists here.
    # So: re-run the kp sweep at 170/0.20 before trusting 0.7. If the
    # oscillation is gone at 170/0.20, walk kp back UP toward 2.0 rather
    # than keeping 0.7 (0.7 undershot real curves once already at
    # min_brightness=70 -- see the kp comment below). To reproduce the Pi's
    # exact last-tested configuration instead, set min_brightness: 70.0 /
    # max_saturation: 0.30 here and leave kp at 0.7 -- but understand
    # that combination is the one the 2026-08-04 bag analysis argues
    # against.
    roi_bottom_fraction: 0.3
    num_points: 30
    lookahead_distance: 0.20
    lateral_gain: 0.6
    heading_gain: 0.35
    curvature_gain: 0.04
    min_brightness: 170.0
    max_saturation: 0.20
    min_pixels: 30.0
    error_scale: 500.0
    roi_widen_step: 0.2
    roi_widen_max: 0.7

    # TurtleBot3 Burger kinematics -- physical constants, same on every Burger.
    wheel_radius: 0.033
    wheel_separation: 0.160
    max_wheel_speed: 20.0

    # Start with the Gazebo-tuned gains; expect to retune kp/kd once you see
    # real-camera noise characteristics -- real frames are noisier than a
    # rendered mask, and real-world lighting will need re-tuning of
    # min_brightness/max_saturation above.
    #
    # kp dropped 5.0 -> 2.0 on 2026-08-04: with max_angular_speed=1.0, kp=5.0
    # saturated the angular command at any |steering_error| > 0.2 -- easily
    # crossed once the robot is actually moving (static bench tests already
    # measured steering_error ~0.17 on a centered line), and once saturated
    # there's no proportional gradient left to self-correct, which is
    # exactly what caused a real spin-in-place incident that day (confirmed
    # via /line_follower/debug: wheel_left=-1.34, wheel_right=3.505 rad/s,
    # frozen at max saturation).
    #
    # kp dropped 2.0 -> 1.0 on 2026-08-06: even after fixing the vision-side
    # bugs (Hough seed bistability, undersized sliding window) and the
    # lost-line speed decay, 2.0 still oscillated on real hardware --
    # confirmed via /line_follower/debug: 0.70 steering-sign-flips/sec,
    # never saturating (|wheel_diff| max 4.85, limit ~6.5+), so this is
    # underdamped closed-loop control, not the earlier saturation-driven
    # runaway. A no-PID pure-proportional diagnostic (same vision.py output,
    # kp=0.5, no kd/recovery_gain/integral) tracked the same track cleanly
    # at 0.08 flips/sec -- confirming the oscillation is from this
    # controller's gain/damping, not the vision signal itself.
    #
    # kp=1.0 immediately re-tested same day: no oscillation this time, but
    # undershot real curves and drove off-track (steering correction too
    # weak/slow to keep up with the line's curvature) -- so 1.0 and 2.0
    # bracket a working range without landing in it.
    #
    # kp=1.5 re-tested same day, twice: first run drove off-track and locked
    # onto an unrelated white object elsewhere in the room as if it were the
    # line (a separate bug from oscillation -- vision.py has no plausibility
    # check rejecting a "found" detection that jumped far from the last
    # known-good position, so once truly off the real track it will happily,
    # confidently latch onto ANY white line-like shape in view; see that
    # run's bag for the frame-by-frame confirmation). Retested with the
    # room lights off (to rule out that object's reflectivity as a factor)
    # and it stayed on-track this time, but still oscillated -- 0.78
    # steering-sign-flips/sec, close to kp=2.0's 0.70, i.e. lights and the
    # stray-object lock don't explain the oscillation itself. So 1.0-2.0
    # doesn't contain a clean point either. Trying below 1.0 next (kd
    # unchanged at 0.35 for this step -- isolate kp's own contribution
    # first): 0.7, between the oscillating 1.0-2.0 range and the
    # pure-proportional (no kd/recovery_gain/integral) diagnostic's clean
    # 0.5.
    kp: 0.7
    ki: 0.0
    kd: 0.35
    n_filter: 20.0

    # base_linear_speed/base_speed_scale/max_angular_speed were NOT exposed
    # as parameters at all until 2026-07-31 -- any value written here before
    # that silently did nothing, and the node always ran ControllerConfig's
    # Gazebo-tuned dataclass defaults (base_linear_speed=20, base_speed_scale
    # =0.03, max_angular_speed=1.5) no matter what. Confirmed on real
    # hardware: those defaults commanded 0.343 m/s linear (TurtleBot3
    # Burger's own rated max is ~0.22 m/s) with angular.z pinned at the 1.5
    # saturation ceiling. base_speed_scale dropped 10x below to cap linear
    # speed at found=true/straight-line around 0.06 m/s (base_linear_speed
    # * base_speed_scale, matching ~/line_follower_ws's own from-scratch
    # node's linear_speed default on this same robot) -- still just a
    # starting point, re-tune from an actual run's data like everything else
    # here, not a validated final value.
    base_linear_speed: 20.0
    base_speed_scale: 0.003
    max_angular_speed: 1.0

    # This project's real TurtleBot3's turtlebot3_node subscribes to
    # TwistStamped, not plain Twist (the since-removed Gazebo ros_gz_bridge wanted plain
    # Twist instead -- see cmd_vel_stamped's comment in
    # line_follower_node.py/control_node.py). Confirmed 2026-07-31:
    # publishing plain Twist against this robot silently never reached
    # turtlebot3_node at all (different msg type on the same topic name, no
    # error, robot just never moved).
    cmd_vel_stamped: true

    # Pure PID baseline for the first real run -- no sim-trained residual
    # policy loaded. Only turn this on after the PID-only baseline is
    # verified to track the line reliably.
    residual_model_path: ""
    residual_algo: sac
    residual_max_delta_omega: 1.0
    residual_max_delta_v: 1.0
    residual_use_wheel_speed_obs: false
    residual_use_2d_action: false

# --- Single-node deployment (line_follower_node, real_line_follower.launch.py) ---
line_follower_node:
  ros__parameters:
    # Matches ~/camera_ros_ws on the Pi (christianrauch/camera_ros wrapping
    # libcamera): its launch file remaps image_view's viewer to
    # /camera/image_raw, implying that's CameraNode's own default output
    # topic. Re-verify once the Pi is actually running:
    #   ros2 topic list | grep -i image
    #   ros2 topic hz <topic>
    #   ros2 topic echo <topic> --field encoding   # must be rgb8/bgr8/rgba8/bgra8
    image_topic: /camera/image_raw
    cmd_vel_topic: /cmd_vel
    diagnostic_topic: /line_follower/debug

# --- Split deployment: vision_node runs on the Pi (next to the camera) ---
line_follower_vision_node:
  ros__parameters:
    image_topic: /camera/image_raw    # see the note under line_follower_node above
    local_path_topic: /line_follower/local_path

# --- Split deployment: control_node runs on the PC ---
line_follower_control_node:
  ros__parameters:
    local_path_topic: /line_follower/local_path
    cmd_vel_topic: /cmd_vel
    diagnostic_topic: /line_follower/debug
    # If no local_path message arrives within this many seconds, treat the
    # input as lost (found=False) instead of replaying a stale command --
    # see control_node.py's module docstring. 1.0s matches the
    # watchdog_timeout convention already used by ~/line_follower_ws's own
    # from-scratch node on the Pi.
    watchdog_timeout: 1.0
