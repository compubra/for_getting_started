# Real-hardware parameters. Covers three deployment shapes that all share the
# same vision/camera/PID tuning:
#   - line_follower_node: single-node, vision+PID in one process
#     (see launch/real/real_line_follower.launch.py). Run this on whichever
#     machine has the camera topic reachable -- it's network-agnostic.
#   - line_follower_vision_node + line_follower_control_node: the split
#     architecture (vision_node on the Pi next to the camera,
#     control_node on the PC) -- see simple_camera_pid/real/vision_node.py's
#     module docstring for why you'd want this split.
# The /**: section below applies to ANY node name, so both shapes read the
# same camera/vision tuning from one place -- edit it once, not per-node.

/**:
  ros__parameters:
    # --- Real camera geometry -- image_width/image_height/camera_pitch_deg
    # are CONFIRMED: image_width/image_height was 800x600 (measured from
    # ~/camera_test_frame.png on the Pi) until 2026-08-03, when the real
    # camera's driver was reconfigured to 640x480 to match MuJoCo/Gazebo (see
    # common/camera_geometry.py's turtlebot3_burger_gazebo_camera()
    # docstring) -- re-verify against a fresh capture if this drifts again.
    # camera_pitch_deg confirmed 2026-08-03 directly against the real robot
    # -- the camera IS mounted at 15 deg down-pitch (matching
    # hpc/*/lsac/vision.py's CAM_PITCH_DEG, which turned out to already be
    # correct -- it was this yaml's placeholder 0.0 that was wrong, not that
    # file). camera_fovy_deg/camera_mount_height are still UNCONFIRMED as
    # real measurements -- they're copied from turtlebot3_burger_gazebo_camera(),
    # so these may already be the real numbers rather than sim placeholders,
    # but there's no separate calibration record on the Pi to confirm that --
    # verify before trusting (checkerboard calibration or datasheet + a tape
    # measure). See turtlebot3_burger_real_camera()'s docstring in
    # simple_camera_pid/common/camera_geometry.py for how to get each value.
    #
    # IMPORTANT: every real-robot vision test run earlier in this session
    # (the heading-rotation and lateral-shift sign-convention checks) used
    # the WRONG pitch_deg=0.0 AND the since-superseded 800x600 resolution --
    # their found/sign conclusions still hold (those only depended on which
    # side the line was on, not exact geometry), but the numeric
    # lateral_error/heading_error magnitudes from those runs don't apply
    # anymore and shouldn't be reused as reference values.
    camera_profile: real
    image_width: 640     # CONFIRMED 2026-08-03: real camera driver reconfigured to this
    image_height: 480    # CONFIRMED 2026-08-03: real camera driver reconfigured to this
    # 2026-08-04: 45.9857 (an Intel RealSense r200 leftover, copied from the
    # old Gazebo preset) -> 48.6867, derived from the official Raspberry Pi
    # Camera Module v2 (IMX219) spec the real robot actually uses: 62.2 deg
    # horizontal, so 2*atan((480/640)*tan(62.2deg/2)) = 48.6867 at this 4:3
    # output (official quotes 48.8 vertical; 0.11 deg is spec rounding).
    # Spec-derived, so still not a per-unit MEASUREMENT -- calibrate to be sure.
    camera_fovy_deg: 48.6867     # UNCONFIRMED as a real measurement -- see note above
    camera_mount_height: 0.133   # UNCONFIRMED as a real measurement -- see note above
    camera_pitch_deg: 15.0       # CONFIRMED 2026-08-03 against the real robot
    camera_roll_deg: 0.0         # UNCONFIRMED (added 2026-08-07, no-op default) --
    # mount roll about the optical axis. A 2026-08-07 session found a stable,
    # low-noise heading_error/lateral_error bias with the robot stationary
    # and centered on a straight line (heading_error ~+0.21 to +0.34 rad,
    # lateral_error ~+0.01 to +0.02, drifted between separate sessions --
    # suspected mount looseness, not measurement noise) that this and/or
    # camera_yaw_deg below are meant to cancel. See
    # turtlebot3_burger_real_camera()'s docstring (common/camera_geometry.py)
    # for the calibration procedure -- do not guess a value here, measure it
    # via /line_follower/local_path with the robot stationary.
    camera_yaw_deg: 0.0          # UNCONFIRMED (added 2026-08-07, no-op default) --
    # mount yaw about true-vertical; see camera_roll_deg's comment above and
    # turtlebot3_burger_real_camera()'s docstring for calibration.

    # Vision thresholds -- min_brightness/max_saturation are the most likely
    # to need retuning for real ambient lighting (indoor fluorescent/LED vs.
    # Gazebo's rendered lighting model). roi_bottom_fraction/lookahead_distance
    # started as the Gazebo values; re-measure found-rate on your real track
    # before trusting them (see common/vision.py's roi_widen_step docstring
    # for how this project debugged the same problem in sim).
    #
    # 2026-08-04: min_brightness 70 -> 170, max_saturation 0.30 -> 0.20.
    # Root-caused a live oscillation crash (control_node commanded violent
    # wheel-speed swings, robot span in place) to _detect_mask's real-frame
    # segmentation, not the PID gains -- see lap_20260804_162821 bag
    # analysis. Extracted the exact frames around the crash and reran
    # LineFollowerVision offline: the false-positive frame had 50.5% of the
    # ROI's ground pixels sitting in the value=[70,90) bin (vs. 24.7% in a
    # clean frame moments before) -- ordinary asphalt brightness had drifted
    # up to sit ON TOP OF the old min_brightness=70 threshold, so roughly
    # half the ground got flagged as line-candidate and the sliding window
    # snapped between the real line and that false region, flipping
    # steering_error from +0.42 to -0.12 in under 100ms. Value=[110,190) was
    # essentially EMPTY in both frames (line pixels sit at 200+, ground never
    # got above ~90) -- 170 sits in that gap with margin on both sides, so it
    # should hold even as ground brightness drifts with real lighting.
    # max_saturation tightened alongside it since ground saturation (p90
    # ~0.10-0.11 in both sampled frames) turned out to contribute little
    # separation from line pixels (~0.01-0.02) at 0.30 -- 0.20 gives it some
    # actual filtering power without touching the line's own ~0.02. Both
    # derived from only two real frames (one clean, one mid-crash) -- re-tune
    # against a fuller real-track sample if false positives recur.
    #
    # 2026-08-10 CORRECTION -- the 2026-08-04 entry above is wrong about what
    # min_brightness does, and the 2026-08-07 note below it was written on
    # that wrong understanding.
    #
    # In the MATLAB expression this port carried over,
    #   adaptive = min(min_brightness, max(40, 0.55*roi_max))
    # min_brightness is a CEILING, not a floor. On 8-bit frames the applied
    # cut therefore could never exceed 0.55*255 = 140.25, so the 170 written
    # here was unreachable -- what actually ran was the bare 0.55*roi_max,
    # i.e. a cut proportional to the ROI's brightest pixel. Raising 70 -> 170
    # did change behaviour, but not to "a fixed 170": it switched a fixed cut
    # of 70 for a fully floating one between 40 and 140.
    #
    # Re-measured against the real bags (2026-08-06/07 runs, 434 sampled
    # frames): the applied cut ranged 40-89; the mask covered 23-48% of the
    # ROI on 10-32% of frames; on 27-50% of frames it sat at or below the
    # ROI's own 90th-percentile value, i.e. bare carpet was passing as line;
    # and the white line itself never read above 162 anywhere in those runs.
    # The failure mode is self-reinforcing -- as the line leaves the ROI,
    # roi_max collapses to the ground's own brightness, the cut drops with
    # it, and the ground becomes line-candidate at exactly the moment a clean
    # found=False was wanted. That is the "confidently latched onto an
    # unrelated white object" run in the kp log below.
    #
    # Two changes, which only work as a pair:
    #   1. vision.py's min_brightness is now a FLOOR
    #      (adaptive_brightness_fraction: 0.0 below restores nothing; set it
    #      to 0.55 to get the old ceiling rule back).
    #   2. The camera's exposure is now LOCKED in
    #      launch/real/robot_bringup.launch.py (exposure_time: 24000 us,
    #      analogue_gain: 2.0). A fixed floor is only safe with a fixed
    #      exposure -- under auto-exposure it blinds the robot the moment AE
    #      stops down, and the bag numbers above are what AE was doing.
    # Measured live 2026-08-10 with both in place, robot stationary and
    # centred on the track, lab lights ON: line value p10 201 / p50 207,
    # ground p99 114 / max 126, line saturation p90 0.048, found rate 100%,
    # applied cut a flat 170.0 on every frame (it used to wander), and
    # frame-to-frame |d steering_error| 4x lower than under the old rule
    # (mean 0.0006 vs 0.0024, max 0.0022 vs 0.0240).
    #
    # This is also why the lab no longer has to be run with the lights off:
    # that was a workaround for AE re-metering, not for the lighting itself.
    #
    # STILL TRUE from the 2026-08-07 note: 170/0.20 and kp: 0.7 have never
    # run together on the robot, and every kp run in the log below (2.0 ->
    # 1.0 -> 1.5 -> 0.7) was driven with min_brightness=70 /
    # max_saturation=0.30 AND auto-exposure AND a control loop that was
    # actually ticking at 1.8-21 Hz rather than 20 (see kp's own comment).
    # Re-run the kp sweep before trusting any of those numbers.
    #
    # 2026-08-11: roi_bottom_fraction 0.3 is TOO SHALLOW ON THIS CAMERA and it
    # is what makes heading_error meaningless. At 15 deg pitch and 0.133 m
    # mount height, the bottom 30% of the frame covers only about 0.08 m of
    # ground DEPTH, and heading_error is the derivative of a quadratic fitted
    # across that depth, evaluated at lookahead_distance 0.20 -- which lands
    # on the near EDGE of the fitted range, where a short-baseline quadratic's
    # slope is least determined.
    #
    # Measured with the robot stationary on a straight, 100 live frames whose
    # ROI p90 brightness varies by 2 counts (i.e. the exposure lock from
    # 80f951c is working and the input is essentially one repeated image):
    # the fitted quadratic's a coefficient has mean 4.6 and sd 17.8, ranging
    # -33.6 to +75.2, so atan(2a*x + b) saturates and heading_error covers its
    # whole -1.000..+1.000 range on identical pictures. lateral_error, which
    # is a position rather than a derivative, stays 6x steadier on the same
    # frames.
    #
    # Replaying one 60-frame burst through every candidate (found_rate 1.000
    # throughout):
    #
    #   roi  lookahead  x-span   |a| med  heading sd  frame-to-frame
    #   0.3  0.20       0.071 m  13.84    0.678       0.363
    #   0.4  0.20       0.166 m   4.35    0.504       0.244
    #   0.5  0.30       0.317 m   0.97    0.145       0.112
    #   0.6  0.30       0.448 m   0.29    0.085       0.084
    #   0.7  0.30       1.111 m   0.03    0.046       0.026
    #
    # 0.6 / 0.30 is the recommendation: 8x steadier heading than today with a
    # 0.45 m baseline that is still real ground. 0.7 is NOT recommended
    # despite scoring best -- its x-span jumps 2.5x for a 0.1 ROI increase,
    # the signature of the ROI reaching toward the horizon, where a
    # one-pixel error projects to tens of centimetres and the extra
    # smoothness is not information.
    #
    # NOT YET RUN ON A MOVING ROBOT. This is a stationary-frame analysis: it
    # shows the heading signal gets better, not that the closed loop does, and
    # a deeper ROI sees more of the room, which is where the 2026-08-04 false
    # positives came from (the Otsu gate above should now reject them, but
    # that pairing has not been driven). Change roi and lookahead together --
    # a 0.30 lookahead inside a 0.3 ROI would be pure extrapolation.
    #
    # 2026-08-11 (later the same day): THE COST OF roi 0.6 WAS NOT THE ROI.
    # roi 0.6 was tried live and dropped /line_follower/local_path from
    # 20.0 Hz to 9.23 Hz, which is why the value below is still 0.3. Profiling
    # LineFollowerVision.step() per stage on 150 live frames found the whole
    # frame-rate question is one stage: _hough_seed is 83% of the pass at
    # EVERY ROI depth (24.7 ms of 29.8 at roi 0.3, 45.2 of 53.3 at 0.6 -- this
    # PC, so relative only). probabilistic_hough_line costs time per LIT MASK
    # PIXEL, and this track's path is ~275-357 px wide on a 640 px frame, so
    # the mask handed to it covers 44-49% of the ROI. OpenCV's own HoughLinesP
    # on the same filled mask is barely faster (38.7 vs 44.0 ms), which is what
    # shows the cost is the point count and not the implementation.
    #
    # Transport was ruled out as an explanation, two ways. (1) Arithmetic: a
    # per-frame cost that does not depend on ROI cannot produce a bigger
    # roi-0.3-to-0.6 ratio, it produces a smaller one, and at roi 0.3 the Pi
    # appeared to hold exactly 20.0 Hz, so transport AND vision together
    # already fitted inside 50 ms there. (That 20.0 Hz reading turned out to
    # be the camera CEILING rather than a throughput result -- see the
    # on-robot block below -- but the conclusion survives, because a
    # ROI-independent cost still cannot explain a ratio that grows with ROI,
    # and the direct measurement in (2) settles it anyway.)
    # (2) Measured: a 640x480x3
    # sensor_msgs/Image between two Python processes costs 0.385 ms to
    # serialise, 0.284 ms to deserialise, and 0.040 ms for the node's
    # _image_msg_to_rgb. Note also that loading the vision node into
    # camera_container is not available regardless -- rclpy has no composable
    # node support (there is no rclpy_components; rclcpp_components containers
    # take C++ plugins only), so that would mean a C++ rewrite.
    #
    # vision.py now has a seed_mode parameter for this. seed_mode "hough" is
    # the default and is bit-identical to every previous release (verified: 0
    # found mismatches and max |delta| exactly 0.000e+00 on steering / lateral
    # / heading / confidence over 2692 frames -- 150 live stationary plus 1196
    # of the 2026-07-31 driven lap, at both roi 0.3 and 0.6). seed_mode
    # "run_midpoint" reads the seed straight off the mask instead:
    #
    #   roi  seed_mode      ms/frame  heading sd  base_col sd  near_px_err sd
    #   0.3  hough             28.6      0.5432       189.3         133.7
    #   0.3  run_midpoint       4.0      0.3180         1.4          33.3
    #   0.6  hough             54.1      0.0518       106.3          65.9
    #   0.6  run_midpoint       5.0      0.0295         1.3          28.2
    #
    # ^^ THOSE TWO hough ROWS ARE PC NUMBERS AND THE ROBOT DOES NOT REPRODUCE
    # THEM. Replaying the same 120 frames through the same code on the Pi and
    # on this PC agrees on only 7/120 frames at roi 0.3 and 38/120 at roi 0.6
    # (max |delta| heading 0.98 / 1.05). Both machines are deterministic
    # within a process, and the masks are provably identical -- "run_midpoint"
    # depends only on the mask and is bit-identical 120/120 at four ROI depths
    # -- so the divergence is inside _hough_seed. skimage 0.22.0 on the Pi
    # against 0.26.0 here is the leading explanation, not isolated by
    # downgrading. The "run_midpoint" rows transfer exactly; treat every
    # offline-PC "hough" figure as PC-only.
    #
    # The defect is real on both machines but has a DIFFERENT SIGNATURE on
    # each, and the robot's is the one that matters. On the PC the seed jitters
    # (base_col sd 106-189 px on one repeated picture). On the Pi it barely
    # jitters at all (sd 9-14 px) and is instead systematically WRONG: with the
    # mask's path spanning columns 216-595, midpoint 405.5, the Hough seed sits
    # at 593-596 -- locked onto the path's right-hand EDGE, ~176 px off centre,
    # which at error_scale 500 is about 0.35 of lateral_error. Live on the Pi
    # that shows up as lateral mean +0.181 (hough) against +0.068
    # (run_midpoint) at roi 0.3. Same root cause either way, and exactly what
    # _hough_seed's own docstring warns about: on a path this wide both long
    # edges qualify as the dominant segment.
    #
    # It then propagates: the +/-search_radius gate truncates a path wider than
    # the gate on 53-73% of frames, so _find_nearest_run returns a slice
    # centred on wherever the seed landed rather than the path, and
    # corr(first window midpoint, seed) is 0.96 / 0.89. With the Hough seed
    # removed that correlation falls to 0.20 / 0.14 and gate truncation to
    # 31% / 5%. This is the same defect as the heading_error conditioning
    # problem above, seen from the other end.
    #
    # So the ROI-depth trade this comment block was written around is no
    # longer a trade: at seed_mode "run_midpoint", roi 0.6 costs 5.0 ms/frame
    # against 27.6 ms for the SHIPPED roi 0.3 today -- 5.5x cheaper than the
    # setting it would replace. Deliberate behaviour change, quantified: over
    # the driven lap it matches "hough" exactly on 94% of frames (roi 0.6),
    # max |delta| 0.074 steering / 0.154 heading, 0 found-flag mismatches.
    #
    # ON THE ROBOT, 2026-08-11, USB-C powered (throttled=0x0, ARM 1.5 GHz),
    # stationary on a straight with the lights off, rate measured by
    # ros2 topic hz ON the Pi over ~500 samples per cell:
    #
    #   roi   lookahead  seed_mode     rate Hz  heading sd  lateral mean
    #   0.30  0.20       hough (SHIP)   14.65     0.2111       +0.1809
    #   0.30  0.20       run_midpoint   20.006    0.4474       +0.0675
    #   0.60  0.30       hough           9.90     0.1346       +0.1077
    #   0.60  0.30       run_midpoint   20.010    0.1481       +0.0925
    #   0.65  0.30       run_midpoint   20.079    0.1089       +0.0829
    #
    # run_midpoint pins 20 Hz at EVERY depth including 0.65, where step() is
    # 21.3 ms against a 50 ms budget -- not a marginal pass. So roi 0.6 +
    # run_midpoint beats the shipping config on BOTH axes at once (20.01 Hz
    # and 0.148 against 14.65 Hz and 0.211), which the trade this block was
    # written around said was impossible.
    #
    # Two readings in this file's earlier entries do not survive that session:
    #  - "roi 0.3 -> 20.0 Hz" was the CAMERA CEILING, not throughput. The
    #    driver pins frame_duration 50000, i.e. exactly 20.000 Hz, so no
    #    configuration can exceed it and 20.0 Hz never measured headroom.
    #    Re-measured today the same config gives 14.65-15.44 Hz; the old
    #    20.0 Hz did not reproduce, most likely a brighter scene (PPHT cost
    #    scales with lit mask pixels) -- not isolated.
    #  - run_midpoint is NOT uniformly better on heading. At roi 0.3 it is
    #    worse (0.4474 against 0.2111), because hough's smoothness there is
    #    partly self-reference: its window measures a 17 px fragment of a
    #    380 px path and corr(window, seed) is 0.64. The gain is at depth.
    #
    # NOT DRIVEN, IN EITHER MODE. Everything above is stationary, one pose,
    # one straight section, lights off. It says the signal is fresher and less
    # biased, not that the robot drives better. seed_mode is deliberately NOT
    # set in this file, so nothing changes until someone measures it moving.
    #
    # READ THIS BEFORE THE FIRST DRIVEN RUN WITH run_midpoint: switching the
    # seed MOVES THE LATERAL SETPOINT, from the path's right edge to its
    # centre, by ~176 px / ~0.35 of lateral_error. Every gain in this file was
    # tuned against the edge-following signal. The first driven run after the
    # switch is a RE-BASELINE, not a comparison -- the six runs of 2026-08-10
    # are not valid controls for it. Untested at track crossings and on
    # curves, where a deeper ROI also pulls in more of the room; that is the
    # main new risk. To try it:
    #   ros2 run simple_camera_pid line_follower_vision_node --ros-args \
    #     --params-file <this file> \
    #     -p roi_bottom_fraction:=0.6 -p lookahead_distance:=0.30 \
    #     -p seed_mode:=run_midpoint
    # and check the published rate is back at 20 Hz before scoring anything.
    # Reproduce the table with:
    #   python3 tools/diagnose_vision_geometry.py seed --roi 0.6 --lookahead 0.30 \
    #     --frames ~/桌面/tuning_20260810/vision_profiling_20260811/stationary_150frames_roi06_live.npz
    # 2026-08-11 EVENING -- TUNED ON THE ROBOT, and these three now ship
    # together. seed_mode "run_midpoint" is what makes the rest possible: it
    # removes the Hough seed, which was 83% of the vision pass AND the largest
    # error source, so a deeper ROI no longer costs frame rate. Measured on
    # the Pi, all cells 20.0 Hz and found_rate 1.000, robot driven at
    # 0.075 m/s on one track from one start pose (first 10 s discarded):
    #
    #   roi  lookahead  steer RMS  lat RMS  angular |max|
    #   0.6  0.30         0.098     0.086      0.718
    #   0.6  0.20         0.083     0.054      0.486
    #   0.4  0.20         0.094     0.056      0.875
    #
    # Shorter lookahead won on every axis: heading_error is a SLOPE that
    # clamps at +/-1.0, and on an arc it reads about lookahead/radius, so a
    # 0.30 m lookahead saturates on anything tighter than a 0.30 m radius
    # while 0.20 m holds down to 0.20 m. Saturating costs twice -- the
    # heading term stops responding AND the curve governor reads maximum
    # severity and floors the speed.
    #
    # roi 0.4 is the OPERATOR'S CHOICE, recorded honestly: on the measurement
    # above it matches roi 0.6 on lateral RMS (0.056 vs 0.054, inside the
    # 2-5% run-to-run spread) but is worse on steering RMS and, the real
    # difference, needs a much larger peak turn (0.875 vs 0.486 against the
    # then-1.0 ceiling). The mechanism is the one this file documents further
    # up: a shallower ROI is a shorter fit baseline, so heading_error is
    # noisier and the controller works harder. roi 0.6 is the better-measured
    # value; 0.4 ships because it was asked for, and max_angular_speed below
    # was raised to give it the headroom it needs.
    roi_bottom_fraction: 0.4
    # "hough" (previous default) or "run_midpoint". See vision.py's seed_mode
    # docstring and the block above; "hough" remains bit-identical to every
    # release before 2026-08-11 and is kept for that comparison.
    seed_mode: run_midpoint
    num_points: 30
    lookahead_distance: 0.20
    lateral_gain: 0.6
    heading_gain: 0.35
    curvature_gain: 0.04
    # 2026-08-10, LIGHTS-OFF ROOM. min_brightness pairs with the exposure
    # lock in robot_bringup.launch.py -- they are ONE calibration, changing
    # either alone breaks detection. Two measured pairs:
    #
    #   lights OFF (current default): frame_duration 50000 (20 fps) /
    #     exposure_time 49000 / analogue_gain 10.0  ->  min_brightness 105
    #     line p10 130, p50 139, line saturation p90 0.140;
    #     ground p99 58, max 81.  Floor 105 sits mid-gap, ~24 either side.
    #
    #   lights ON: frame_duration 33333 (30 fps) / exposure_time 24000 /
    #     analogue_gain 2.0  ->  min_brightness 170
    #     line p10 201, p50 207, line saturation p90 0.048;
    #     ground p99 114, max 126.  Strictly the better of the two -- bigger
    #     gap, and 3x the saturation margin. Prefer it when there is time.
    #
    # Do NOT mix them: 105 with the lights on lets the ground through (it
    # reaches 126 there), and 170 with the lights off finds nothing at all
    # (the line only reaches ~146 under AE, ~139 locked -- measured, the
    # mask came out 0.00% of the ROI).
    #
    # max_saturation 0.20 holds for both, but the margin is much thinner in
    # the dark: the line's own saturation is 0.140 there against 0.048 with
    # the lights on, because saturation is dominated by how dark the pixel
    # is, not by gain. If the line starts dropping out in the dark, raise
    # this before touching min_brightness.
    min_brightness: 105.0
    max_saturation: 0.20
    min_pixels: 30.0
    error_scale: 500.0
    # 0.0 = min_brightness above is a hard floor (see the 2026-08-10
    # correction). 0.55 restores MATLAB's adaptive-ceiling rule exactly --
    # verified bit-identical to the pre-2026-08-10 code on 120 real bag
    # frames, so it is a clean A/B if you want to compare on the robot.
    # 2026-08-10, validated by replaying the whole lap_20260810_140059 lap
    # through LineFollowerVision (825 frames: 703 with a line in view, 122
    # without, ground truth = Otsu class-mean gap >= 30):
    #
    #   fixed floor 105 : 703/703 real lines found, but 11/122 FALSE
    #                     POSITIVES on line-free frames   39.0 ms/frame
    #   otsu + gate 30  : 703/703 real lines found, 0/122 false positives
    #                                                    40.5 ms/frame
    #
    # The false positives are the failure this project has crashed on twice
    # (the sliding window latching onto bare ground / an unrelated white
    # object). Otsu removes all of them for +1.5 ms and no lost detections,
    # so it is on. min_brightness above is UNUSED while this is > 0.
    #
    # The gate is not optional: Otsu always returns a split, so on a
    # line-free frame it bisects sensor noise and hands back a confident
    # detection. 30 sits in the empty band between the two measured
    # populations (line in view: class-mean gap 123 median; line-free: under
    # 30, max 29). Set otsu_min_contrast: 0.0 to go back to the fixed floor.
    otsu_min_contrast: 30.0
    adaptive_brightness_fraction: 0.0
    roi_widen_step: 0.2
    roi_widen_max: 0.7

    # TurtleBot3 Burger kinematics -- physical constants, same on every Burger.
    wheel_radius: 0.033
    wheel_separation: 0.160
    max_wheel_speed: 20.0

    # Start with the Gazebo-tuned gains; expect to retune kp/kd once you see
    # real-camera noise characteristics -- real frames are noisier than a
    # rendered mask, and real-world lighting will need re-tuning of
    # min_brightness/max_saturation above.
    #
    # kp dropped 5.0 -> 2.0 on 2026-08-04: with max_angular_speed=1.0, kp=5.0
    # saturated the angular command at any |steering_error| > 0.2 -- easily
    # crossed once the robot is actually moving (static bench tests already
    # measured steering_error ~0.17 on a centered line), and once saturated
    # there's no proportional gradient left to self-correct, which is
    # exactly what caused a real spin-in-place incident that day (confirmed
    # via /line_follower/debug: wheel_left=-1.34, wheel_right=3.505 rad/s,
    # frozen at max saturation).
    #
    # kp dropped 2.0 -> 1.0 on 2026-08-06: even after fixing the vision-side
    # bugs (Hough seed bistability, undersized sliding window) and the
    # lost-line speed decay, 2.0 still oscillated on real hardware --
    # confirmed via /line_follower/debug: 0.70 steering-sign-flips/sec,
    # never saturating (|wheel_diff| max 4.85, limit ~6.5+), so this is
    # underdamped closed-loop control, not the earlier saturation-driven
    # runaway. A no-PID pure-proportional diagnostic (same vision.py output,
    # kp=0.5, no kd/recovery_gain/integral) tracked the same track cleanly
    # at 0.08 flips/sec -- confirming the oscillation is from this
    # controller's gain/damping, not the vision signal itself.
    #
    # kp=1.0 immediately re-tested same day: no oscillation this time, but
    # undershot real curves and drove off-track (steering correction too
    # weak/slow to keep up with the line's curvature) -- so 1.0 and 2.0
    # bracket a working range without landing in it.
    #
    # kp=1.5 re-tested same day, twice: first run drove off-track and locked
    # onto an unrelated white object elsewhere in the room as if it were the
    # line (a separate bug from oscillation -- vision.py has no plausibility
    # check rejecting a "found" detection that jumped far from the last
    # known-good position, so once truly off the real track it will happily,
    # confidently latch onto ANY white line-like shape in view; see that
    # run's bag for the frame-by-frame confirmation). Retested with the
    # room lights off (to rule out that object's reflectivity as a factor)
    # and it stayed on-track this time, but still oscillated -- 0.78
    # steering-sign-flips/sec, close to kp=2.0's 0.70, i.e. lights and the
    # stray-object lock don't explain the oscillation itself. So 1.0-2.0
    # doesn't contain a clean point either. Trying below 1.0 next (kd
    # unchanged at 0.35 for this step -- isolate kp's own contribution
    # first): 0.7, between the oscillating 1.0-2.0 range and the
    # pure-proportional (no kd/recovery_gain/integral) diagnostic's clean
    # 0.5.
    # 2026-08-10, kd 0.35 -> 0.0. Everything above this line was measured
    # with the control loop running at a median ~6 Hz while FilteredPID had
    # ts=0.05 (20 Hz) baked into its derivative term -- see 80f951c. That
    # inflated the D contribution roughly 3x, so the whole 5.0 -> 2.0 -> 1.0
    # -> 1.5 -> 0.7 kp walk above was compensating an over-strong derivative,
    # not a too-large proportional gain. With the loop now genuinely at
    # 20.0 Hz (measured on /cmd_vel), six 60 s runs on this robot, safety
    # filter off, first 10 s of each discarded as placement transient:
    #
    #   kp   kd    found   angRMS  sat    flips/s
    #   0.7  1.00  0.234   0.691   0.294  -        (unusable: 29% of samples
    #                                               at the angular ceiling,
    #                                               left the track at t=23 s)
    #   0.7  0.35  0.952   0.354   0.009  0.96
    #   0.7  0.00  0.994   0.127   0.000  0.47
    #   0.7  0.00  1.000   0.112   0.000  0.19     } same track section,
    #   0.7  0.00  1.000   0.133   0.000  0.51     } repeat of one condition
    #   1.5  0.00  0.854   0.375   0.000  0.91     } same section as those two
    #
    # kd is monotonically harmful here: 0 gives a found_rate of 1.000, an
    # angular-command RMS a third of kd=0.35's, and never touches the
    # max_angular_speed ceiling (peak 0.29-0.31 against a 1.0 limit). The
    # 0.35 row's 0.009 saturation fraction and 1.000 peak are the same
    # runaway mechanism, just smaller.
    #
    # Read the flips/s column with the repeat in mind: 0.19 and 0.51 are the
    # SAME configuration on the SAME track section, so that metric alone
    # cannot resolve a difference under about 2x. found_rate, angular RMS and
    # lateral RMS repeated far more tightly and are what the kd conclusion
    # rests on. By that standard kp=1.5's row is a consistent hint (worse on
    # every column) but not a result -- it is a single run, and 0.7 is kept
    # below only because nothing yet argues for moving it.
    #
    # ki stays 0.0 and was not tested: steering -> yaw rate -> heading is
    # already an integration, so an I term makes it a double integrator, and
    # the residual steady-state offset it would chase (lateral bias ~0.036,
    # about 2 cm) is most likely the still-uncalibrated camera_roll_deg/
    # camera_yaw_deg above -- a sensor bias, which ki would "fix" by steering
    # the robot deliberately off-centre. Calibrate the mount instead.
    #
    # NOT established: whether some small kd (0.05-0.15) beats 0. That range
    # was never run -- the session ended first. 0.0 is the best MEASURED
    # value, not a proven optimum.
    # 2026-08-11 EVENING: kp 0.7 -> 1.2, ki 0.0 -> 0.1, kd 0.0 -> 0.05.
    # Tuned after the vision fixes above, i.e. against a 20 Hz feed whose
    # steering_error has a stationary sd of 0.013 rather than 0.091. Every
    # gain conclusion recorded ABOVE this line was measured on the old signal
    # and does not carry over -- including the morning's own kd result.
    #
    # The order things were established, all on the robot, 60 s runs, first
    # 10 s discarded, found_rate 1.000 and zero line losses throughout:
    #
    #   step                          steer RMS  lat RMS  lat bias  v (m/s)
    #   kp 0.7, governor -0.9/0.1       0.137     0.127    +0.121    0.028
    #   + governor -0.5/0.35            0.219     0.184    +0.174    0.043
    #   + kp 1.2                        0.131     0.123    +0.113    0.043
    #   + ki 0.05                       0.084     0.076    +0.044    0.045
    #   + ki 0.1                        0.068     0.061    +0.024    0.045
    #   + kd 0.05                       0.039     0.032    +0.013    0.047
    #
    # ki: the operator asked for it twice and was right both times. The
    # argument against it in this file's earlier entry -- that the offset was
    # probably an uncalibrated camera_yaw/roll and that ki would drive the
    # robot physically off-centre to null a sensor artefact -- was tested and
    # is WRONG. Three independent checks: static readings with the robot on
    # the line average +0.022 (no large fixed bias); the operator observed the
    # left wheel riding the line, which is the +0.113 reading made visible;
    # and running the SAME track in REVERSE flipped both biases (heading
    # +0.487 -> -0.514, lateral +0.024 -> -0.020) at nearly equal magnitude,
    # which a mount bias cannot do. It is an ordinary steady-state tracking
    # error of a proportional controller on a continuously curving path. That
    # reverse run also closes the camera_roll_deg/camera_yaw_deg question
    # left open on 2026-08-07: they are near zero and need no calibration.
    #
    # kd: harmful at 0.35 and 1.0 in the morning, useful at 0.05 in the
    # evening. Not a contradiction -- the morning measured it with vision at
    # 9-15 Hz feeding a 20 Hz loop (67% of ticks saw an unchanged input, so
    # the derivative saw a staircase) and with a steady-state offset
    # dominating the error. At 20 Hz with ki removing the offset, what is
    # left is dynamic error, which is what a derivative is for. 0.05 and 0.1
    # give identical accuracy (steer RMS 0.040 vs 0.041) but 0.1 pushes the
    # peak turn to 0.930 against 0.716, so 0.05 is the knee. The lesson worth
    # keeping: kd's value here is set by what ki and the sample rate are
    # doing, and judging it in isolation produced the wrong answer twice.
    #
    # Repeatability, finally good enough to quote: two runs of kp 1.2 / ki 0.1
    # / kd 0.05 agreed within 5% on every column except sign-flips/sec.
    kp: 1.2
    ki: 0.1
    kd: 0.05
    n_filter: 20.0

    # base_linear_speed/base_speed_scale/max_angular_speed were NOT exposed
    # as parameters at all until 2026-07-31 -- any value written here before
    # that silently did nothing, and the node always ran ControllerConfig's
    # Gazebo-tuned dataclass defaults (base_linear_speed=20, base_speed_scale
    # =0.03, max_angular_speed=1.5) no matter what. Confirmed on real
    # hardware: those defaults commanded 0.343 m/s linear (TurtleBot3
    # Burger's own rated max is ~0.22 m/s) with angular.z pinned at the 1.5
    # saturation ceiling. base_speed_scale dropped 10x below to cap linear
    # speed at found=true/straight-line around 0.06 m/s (base_linear_speed
    # * base_speed_scale, matching ~/line_follower_ws's own from-scratch
    # node's linear_speed default on this same robot) -- still just a
    # starting point, re-tune from an actual run's data like everything else
    # here, not a validated final value.
    # 2026-08-11 EVENING: base_speed_scale 0.003 -> 0.007, max_angular_speed
    # 1.0 -> 1.4.
    #
    # A speed sweep at the tuned gains established where the PID baseline's
    # envelope actually is, which matters because it is the control the
    # residual-RL work has to beat:
    #
    #   base_speed_scale  v (m/s)  lat RMS  steer RMS  found  losses  ang |max|
    #   0.005             0.075     0.054     0.083    1.000    0       0.486
    #   0.007             0.107     0.077     0.148    1.000    0       0.978
    #   0.009             0.140     0.133     0.243    0.991    2       1.024
    #
    # 0.007 is the recommended operating point. Below it error grows linearly
    # with speed (+43% speed, +43% error); above it the growth turns
    # superlinear (+31% speed, +73% error) and the first line losses on a
    # non-crossing track appear.
    #
    # What limits it is worth stating precisely, because two obvious
    # explanations were tested and ruled out. It is NOT perception: found_rate
    # is 1.000 with zero losses at 0.107 m/s. It is NOT actuator saturation:
    # raising max_angular_speed from 1.0 to 1.4 removed the clipping (peak
    # demand 0.978) and changed accuracy by nothing measurable (lat RMS 0.077
    # -> 0.078). The residual is the control law's own structure -- a fixed
    # -gain PID has no way to anticipate, and the loop's phase lag turns into
    # cross-track error at speed.
    #
    # max_angular_speed 1.4 therefore ships NOT for accuracy -- it bought
    # none -- but for headroom, and specifically for roi 0.4, whose noisier
    # heading makes the controller work harder (peak 0.875 at 0.075 m/s where
    # roi 0.6 needed 0.486). At 0.140 m/s the demand reached 1.024, i.e. the
    # old 1.0 ceiling does bind at this ROI. Revert to 1.0 if any
    # spin-in-place recurs -- that incident is why it was 1.0, and 1.4 has
    # only been driven at these gains.
    base_linear_speed: 20.0
    base_speed_scale: 0.007
    max_angular_speed: 1.4

    # Curve_Speed_Governor. Exposed as parameters 2026-08-10 -- until then
    # the real nodes built CurveSpeedGovernorConfig() from its bare dataclass
    # defaults, so these keys were unreachable from any yaml, exactly like
    # base_linear_speed/base_speed_scale/max_angular_speed before 2026-07-31
    # (see the comment above). The values below ARE those defaults, so this
    # block changes no behaviour on its own.
    #
    # It is written down because the governor, not the PID, turned out to
    # own the robot's most visible defect. Over all six 2026-08-10 runs the
    # robot stopped and restarted 8.5-27 times per minute and spent 19-78%
    # of each run below 20 mm/s, and the cause is not ambiguous: the
    # correlation between |heading_error| and commanded linear speed is
    # -1.000. heading_weight 1.0 * |heading_error| always beats
    # lateral_weight 0.8 * a well-tracked lateral error (0.09), so speed is
    # a pure function of heading_error alone.
    #
    # CORRECTION 2026-08-11: an earlier version of this comment claimed
    # heading_error's 0.66-0.74 rad median was "a real reading of a genuinely
    # tight track", inferring a ~0.31 m curve radius from it. That was WRONG,
    # and the governor conclusion below has to be read with that in mind: the
    # signal driving it is mostly noise. See roi_bottom_fraction above for the
    # measurement -- with the robot stationary and 100 frames whose ROI p90
    # brightness varies by 2 counts, heading_error still ranged the full
    # -1.000..+1.000 because it is the SLOPE of a quadratic fitted over the
    # 0.08 m of ground depth roi_bottom_fraction 0.3 leaves visible. The fit's
    # own curvature coefficient has sd 17.8 across those identical frames.
    #
    # So the governor is not merely mistuned for this track -- it is tracking
    # a noise signal with heading_weight 1.0, which is why the speed swings.
    # Fix the ROI depth first (a deeper ROI cuts heading sd about 8x); only
    # then is there a real heading signal worth choosing a slowdown_gain
    # against. Retuning the gain against the current signal would be fitting
    # to noise.
    #
    # The consequence measurements stand regardless of what heading_error
    # means: slowdown_gain -0.9 held the robot at 34-41% speed as a matter of
    # course, and at the +/-1.0 clamp (8-10% of every run) pinned it to the
    # min_speed_scale 0.1 floor -- 6 mm/s, indistinguishable from stopped.
    #
    # UNVERIFIED, DO NOT TREAT AS TUNED. The retune this analysis implies
    # (slowdown_gain -0.5, min_speed_scale 0.35 -- predicted to lift the
    # curve-speed scale from 0.41 to 0.67 at the median and from 0.10 to
    # 0.50 at the clamp) was never run: the robot was shut down first. The
    # governor exists for a reason, so raising these risks overshooting
    # curves -- change them one step at a time and watch found_rate, which
    # was 1.000 at kp 0.7 / kd 0 and is the thing that would break first.
    # 2026-08-11 EVENING: slowdown_gain -0.9 -> -0.5, min_speed_scale
    # 0.1 -> 0.35. Retuned only AFTER the ROI/seed fixes made heading_error a
    # trustworthy input -- doing it earlier would have been fitting to noise,
    # which is what the block above says and still means.
    #
    # Measured on the robot at kp 1.2 / kd 0 / ki 0, 60 s, first 10 s dropped:
    #
    #                        v mean   v p10   stops/min  time <20mm/s
    #   -0.9 / 0.1           0.028   0.0216      4.9         4.5%
    #   -0.5 / 0.35          0.043   0.0380      0.0         0.0%
    #
    # The "moves in fits and starts, crawls through curves" behaviour the
    # operator reported disappeared completely: not one excursion below
    # 10 mm/s in 49 s, against 16-22 per minute at the shipped values earlier
    # that day. found_rate stayed 1.000 with zero losses, which was the risk
    # -- more speed through curves is exactly where the vision would fail
    # first if it were going to.
    #
    # heading_weight stays 1.0 and is now the dominant term by design: with a
    # well-tracked lateral error (~0.05) it always beats
    # lateral_weight * lateral. That is only sound because heading_error is
    # now conditioned well enough to carry that weight -- stationary sd 0.0097
    # against 0.337 before the ROI/seed work.
    curve_heading_weight: 1.0
    curve_lateral_weight: 0.8
    curve_slowdown_gain: -0.5
    curve_slowdown_bias: 1.0
    curve_min_speed_scale: 0.35
    curve_max_speed_scale: 1.0

    # --- Safety layer + lost-line recovery (ported from MATLAB 2026-08-09).
    # Sits between the PID/residual command and the wheels. See
    # simple_camera_pid/common/control/safety_filter.py for the CBF derivation
    # and matlab/runtime/control/README.md for the closed-loop measurements.
    #
    # NOTHING HERE HAS RUN ON THE ROBOT. The numbers are bit-exact ports of
    # values chosen against MuJoCo, whose operating point is different: sim
    # runs 0.15 m/s, this robot runs base_linear_speed*base_speed_scale =
    # 0.06 m/s. safety_max_accel_* and the max_v/max_omega box (taken from
    # base_linear_speed/max_angular_speed above) are therefore well clear of
    # anything this robot actually does -- i.e. the box constraints will
    # effectively never bind until they are re-derived from a real run.
    #
    # ALSO UNRESOLVED: the CBF consumes heading_error directly, and a
    # 2026-08-07 session measured a stable +0.21..+0.34 rad (12-19 deg)
    # heading_error bias with the robot stationary and centred, attributed to
    # mount looseness and not yet cancelled (camera_roll_deg/camera_yaw_deg
    # above are still 0.0 placeholders). Until that is calibrated the barrier
    # is being evaluated around the wrong operating point. Calibrate first.
    control_period: 0.05      # must match this node's timer; on real hardware the
    # loop is not exactly periodic (camera rate, network, processing jitter) and
    # both the rate limits and the line memory's dead reckoning assume fixed dt
    safety_enable_filter: true
    # Default false. 2026-08-09 MuJoCo ablation: neither in-place scanning nor
    # memory-guided recovery beat leaving this project's existing forward-crawl
    # alone -- the untouched baseline reacquired the line and completed a lap,
    # both recovery strategies stopped and never recovered. The bottleneck was
    # measured to be detection, not recovery. Do not enable before the
    # observation side is fixed.
    safety_enable_search: false
    safety_lateral_max: 0.8       # normalized; 0.8 * 0.55 m = 0.44 m lookahead offset
    safety_cbf_alpha: 2.0
    safety_speed_backoff: 0.3     # heuristic near-boundary slowdown, NOT part of the
    # CBF's forward-invariance guarantee -- keep that distinction in any writeup
    safety_max_accel_v: 40.0      # v units/s (x base_speed_scale for m/s^2)
    safety_max_accel_omega: 10.0  # rad/s^2

    # This project's real TurtleBot3's turtlebot3_node subscribes to
    # TwistStamped, not plain Twist (the since-removed Gazebo ros_gz_bridge wanted plain
    # Twist instead -- see cmd_vel_stamped's comment in
    # line_follower_node.py/control_node.py). Confirmed 2026-07-31:
    # publishing plain Twist against this robot silently never reached
    # turtlebot3_node at all (different msg type on the same topic name, no
    # error, robot just never moved).
    cmd_vel_stamped: true

    # Pure PID baseline for the first real run -- no sim-trained residual
    # policy loaded. Only turn this on after the PID-only baseline is
    # verified to track the line reliably.
    residual_model_path: ""
    residual_algo: sac
    residual_max_delta_omega: 1.0
    residual_max_delta_v: 1.0
    residual_use_wheel_speed_obs: false
    residual_use_2d_action: false

# --- Single-node deployment (line_follower_node, real_line_follower.launch.py) ---
line_follower_node:
  ros__parameters:
    # Matches ~/camera_ros_ws on the Pi (christianrauch/camera_ros wrapping
    # libcamera): its launch file remaps image_view's viewer to
    # /camera/image_raw, implying that's CameraNode's own default output
    # topic. Re-verify once the Pi is actually running:
    #   ros2 topic list | grep -i image
    #   ros2 topic hz <topic>
    #   ros2 topic echo <topic> --field encoding   # must be rgb8/bgr8/rgba8/bgra8
    image_topic: /camera/image_raw
    cmd_vel_topic: /cmd_vel
    diagnostic_topic: /line_follower/debug
    # No camera frame within this many seconds -> command the controller's
    # not-found path instead of re-running vision on a stale frame. Added
    # 2026-08-10; this node previously had no camera watchdog at all (the
    # split deployment's control_node always had the network equivalent), so
    # a camera driver dying mid-run left the robot executing its last
    # found=True command indefinitely -- turtlebot3_node has no command
    # timeout of its own. Matches control_node's watchdog_timeout.
    camera_timeout: 1.0

# --- Split deployment: vision_node runs on the Pi (next to the camera) ---
line_follower_vision_node:
  ros__parameters:
    image_topic: /camera/image_raw    # see the note under line_follower_node above
    local_path_topic: /line_follower/local_path

# --- Split deployment: control_node runs on the PC ---
line_follower_control_node:
  ros__parameters:
    local_path_topic: /line_follower/local_path
    cmd_vel_topic: /cmd_vel
    diagnostic_topic: /line_follower/debug
    # If no local_path message arrives within this many seconds, treat the
    # input as lost (found=False) instead of replaying a stale command --
    # see control_node.py's module docstring. 1.0s matches the
    # watchdog_timeout convention already used by ~/line_follower_ws's own
    # from-scratch node on the Pi.
    watchdog_timeout: 1.0
